name = "agentkit-pages"
main = "src/worker.js"
compatibility_date = "2026-07-01"

# Hostnames are attached as Workers Custom Domains (agentkit.sbs, www,
# account.agentkit.sbs, pages.agentkit.sbs) via the CF API — the deploy token cannot edit zone
# routes, and custom domains also provision DNS + certs.

[[r2_buckets]]
binding = "PAGES"
bucket_name = "agentkit-pages"

[[d1_databases]]
binding = "DB"
database_name = "agentkit-pages"
database_id = "4b11c774-698c-4bd8-b31f-77552b5bbab6"

[vars]
ACCOUNT_MODE = "required"
ACCOUNT_URL = "https://account.agentkit.sbs"
PAGES_URL = "https://pages.agentkit.sbs"
OIDC_ISSUER = "https://auth.assay.rs/auth"
OIDC_CLIENT_ID = "agentkit-pages"
MAX_PAGES_PER_USER = "100"
