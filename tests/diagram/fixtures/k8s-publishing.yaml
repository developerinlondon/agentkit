# Source manifests for the k8s extractor's tests and its worked example.
# Not a capture: manifests are themselves the source a repository holds, so
# there is no intermediate tool whose output would need recording.
apiVersion: v1
kind: Namespace
metadata:
  name: publishing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: publish-api
  namespace: publishing
spec:
  replicas: 3
  selector:
    matchLabels:
      app: publish-api
  template:
    metadata:
      labels:
        app: publish-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/publish-api:1.4.0
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgres://pages@publish-db.publishing.svc.cluster.local:5432/pages
            - name: CACHE_URL
              value: redis://publish-cache.publishing.svc.cluster.local:6379
          envFrom:
            - secretRef:
                name: publish-api-credentials
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/artifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: publish-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: publish-api
  namespace: publishing
spec:
  selector:
    app: publish-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: publish
  namespace: publishing
spec:
  tls:
    - hosts:
        - pages.example.com
      secretName: pages-tls
  rules:
    - host: pages.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: publish-api
                port:
                  number: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: publish-db
  namespace: publishing
spec:
  serviceName: publish-db
  replicas: 1
  selector:
    matchLabels:
      app: publish-db
  template:
    metadata:
      labels:
        app: publish-db
    spec:
      containers:
        - name: postgres
          image: postgres:16.4
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: publish-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: publish-db
  namespace: publishing
spec:
  selector:
    app: publish-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: publish-cache
  namespace: publishing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: publish-cache
  template:
    metadata:
      labels:
        app: publish-cache
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: publish-cache
  namespace: publishing
spec:
  selector:
    app: publish-cache
  ports:
    - port: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: publish-artifacts
  namespace: publishing
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: publish-db-data
  namespace: publishing
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: publish-api-credentials
  namespace: publishing
type: Opaque
stringData:
  PGPASSWORD: not-a-real-password
