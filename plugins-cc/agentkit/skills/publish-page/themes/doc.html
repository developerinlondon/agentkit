<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<script>
  (() => {
    // localStorage throws in a sandboxed (opaque-origin) frame, such as the
    // owner shell's content frame - fall through to the default theme there.
    let saved = null;
    try { saved = localStorage.getItem("agentkit-theme"); } catch {}
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  })();
</script>
<style>
  /* AgentKit Pages house theme — deep neutral default, light via toggle. */
  :root {
    --navy: #131417; --navy-deep: #0a0a0c; --card: #1b1d22; --code-bg: #16181c;
    --line: #2a2d34; --ink: #eeeeee; --muted: #9aa0aa;
    --accent: #79a8e7; --accent-soft: #152438; --gold: #f5a742; --red: #e06c75;
    --fig-glow: #182233; --node-hi: #232733; --node-lo: #16181f; --node-border: #3a4150;
    --tile-side: #050506;
    /* Ground for baked-palette diagram SVGs (excalidraw); flips with the
       theme — light mode also inverts the SVG art itself. */
    --diagram-bg: #0e0f12;
    /* Callout severities. Ink and ground are paired per severity because the
       label sits ON the ground — the shared --gold/--red miss 4.5:1 there in
       light mode, so these carry their own darker light-mode inks. */
    --note-ink: #79a8e7; --note-bg: #152438;
    --warn-ink: #f5a742;
    --alarm-ink: #e06c75;
    --ok-ink: #74c69d;
  }
  html[data-theme="light"] {
    --navy: #faf9f5; --navy-deep: #f2f1ea; --card: #ffffff; --code-bg: #f1efe8;
    --line: #e2ded2; --ink: #141413; --muted: #5b584f;
    --accent: #2d64ba; --accent-soft: #e3ecf8; --gold: #8f6c16; --red: #d1383d;
    --diagram-bg: #eef0f4; --fig-glow: #e4e9f1; --node-hi: #ffffff; --node-lo: #f0f3f7; --node-border: #c3cbd6;
    --tile-side: #c9d0da;
    --note-ink: #2d64ba; --note-bg: #e3ecf8;
    --warn-ink: #7f5f12;
    --alarm-ink: #c02a30;
    --ok-ink: #1f7a4d;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  :root {
    --f-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    /* Anything read as prose stays at the measure; only h1, tables and figures
       take the full column, or a heading overhangs its own paragraph. */
    --measure: 43rem;
  }
  body {
    background: linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 220px);
    color: var(--ink); margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.65; padding: 3rem 1.25rem 5rem; min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }
  main { max-width: 64rem; margin: 0 auto; }
  h1 {
    font-size: clamp(2rem, 4.4vw, 2.9rem); font-weight: 700; line-height: 1.08;
    letter-spacing: -0.028em; text-wrap: balance; margin: 0 0 0.9rem;
  }
  /* The opening paragraph carries the thesis, so it is set apart rather than
     left as the first of many. Selected structurally: markdown authors write a
     paragraph after the title, not a class. */
  main > h1 + p, main > .chips + p {
    font-family: var(--f-serif); font-size: 1.19rem; line-height: 1.58;
    max-width: 60ch; margin: 1.4rem 0 0;
    padding-bottom: 2.6rem; border-bottom: 1px solid var(--line);
  }
  h2 { max-width: var(--measure); font-size: 1.6rem; font-weight: 650; letter-spacing: -0.015em; margin: 2.4rem 0 0.8rem; padding-top: 1.2rem; border-top: 1px solid var(--line); text-wrap: balance; }
  h3 { max-width: var(--measure); font-size: 1.05rem; margin: 1.4rem 0 0.5rem; }
  p, li { max-width: 65ch; }
  li { margin-bottom: 0.3rem; }
  a { color: var(--accent); }
  code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.85em;
    background: var(--code-bg); border-radius: 4px; padding: 0.1em 0.35em;
  }
  pre {
    background: var(--navy-deep); border: 1px solid var(--line); border-radius: 8px;
    padding: 1rem 1.2rem; overflow-x: auto; font-size: 0.82rem; line-height: 1.5;
    max-width: var(--measure);
  }
  pre code { background: none; padding: 0; }
  blockquote { border-left: 3px solid var(--accent); margin: 1rem 0; padding: 0.2rem 0 0.2rem 1rem; color: var(--muted); }
  table { border-collapse: collapse; font-size: 0.9rem; display: block; overflow-x: auto; max-width: 100%; }
  th {
    text-align: left; font-family: ui-monospace, Menlo, monospace; font-size: 0.7rem;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    font-weight: 500; padding: 0.5rem 0.9rem 0.5rem 0; border-bottom: 1px solid var(--line);
  }
  td { padding: 0.55rem 0.9rem 0.55rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  img { max-width: 100%; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
  footer {
    margin-top: 4rem; padding-top: 1rem; border-top: 1px solid var(--line);
    font-family: ui-monospace, Menlo, monospace; font-size: 0.7rem;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  }
  footer a { color: var(--muted); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Component library (see SKILL.md): .kicker .chips/.chip .cards/.card .callout
     .flow/.frow/.fbox(.gate.ok.deny) .arrow .mermaid */
  .kicker {
    font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
    margin: 2.2rem 0 0.3rem; max-width: var(--measure);
  }
  .kicker + h2 { margin-top: 0; border-top: none; padding-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.8rem 0; }
  .chip {
    font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem;
    border: 1px solid var(--line); border-radius: 999px; padding: 0.15rem 0.65rem;
    color: var(--muted); background: var(--code-bg);
  }
  .chip strong { color: var(--ink); font-weight: 600; }
  .chip.hot { border-color: var(--accent); color: var(--accent); background: var(--note-bg); }
  .chip.hot strong { color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.9rem; margin: 1.2rem 0; }
  @media (max-width: 40rem) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 1rem 1.2rem; transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 8px 24px -14px rgba(0,0,0,0.6); }
  .card h3 { margin: 0 0 0.35rem; font-size: 0.95rem; }
  .card h3 code { color: var(--accent); background: none; padding: 0; }
  .card p { margin: 0; color: var(--muted); font-size: 0.9rem; max-width: none; }
  .callout {
    border: 1px solid var(--line); border-left: 3px solid var(--note-ink);
    background: var(--card);
    border-radius: 8px; padding: 0.8rem 1.1rem; font-size: 0.92rem;
    margin: 1rem 0; max-width: var(--measure);
  }
  /* The body only sometimes arrives in a <p>, depending on which spelling the
     author used, and a UA margin there makes the same callout two heights.
     Padding does not collapse a margin, so the reset has to be explicit. */
  .callout p { margin: 0 0 0.5rem; max-width: none; }
  .callout p:last-child { margin-bottom: 0; }
  /* The rail and the label always take one colour, and that colour is the
     severity; body text stays in ink. Position cannot pick the label out —
     `:first-child` counts elements, so bold after leading text is also "first"
     — so the renderer marks the real one and this styles the mark. */
  .callout .callout-label {
    display: block; margin: 0 0 0.35rem; max-width: none;
    font-size: 1.02rem; font-weight: 650; color: var(--note-ink);
  }
  .callout.warn { border-left-color: var(--warn-ink); }
  .callout.warn .callout-label { color: var(--warn-ink); }
  .callout.alarm { border-left-color: var(--alarm-ink); }
  .callout.alarm .callout-label { color: var(--alarm-ink); }
  .callout.ok { border-left-color: var(--ok-ink); }
  .callout.ok .callout-label { color: var(--ok-ink); }
  .callout.note { border-left-color: var(--muted); background: var(--code-bg); }
  .callout.note .callout-label { color: var(--muted); }
  .flow { display: flex; flex-direction: column; margin: 1.2rem 0; }
  .frow { display: flex; align-items: stretch; gap: 0.6rem; flex-wrap: wrap; }
  .fbox {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 0.6rem 0.95rem; font-size: 0.85rem; flex: 1 1 10rem;
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .fbox:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -12px rgba(0,0,0,0.6); }
  .fbox .t {
    font-family: ui-monospace, Menlo, monospace; font-size: 0.7rem;
    letter-spacing: 0.1em; text-transform: uppercase; display: block;
    margin-bottom: 0.15rem; color: var(--accent);
  }
  .fbox.gate { border-color: var(--gold); } .fbox.gate .t { color: var(--gold); }
  .fbox.ok { border-color: var(--accent); } .fbox.ok .t { color: var(--accent); }
  .fbox.deny { border-color: var(--red); } .fbox.deny .t { color: var(--red); }
  .fbox .d { color: var(--muted); font-size: 0.8rem; }
  .arrow {
    text-align: center; color: var(--muted); font-family: ui-monospace, Menlo, monospace;
    font-size: 0.8rem; padding: 0.25rem 0;
  }
  pre.mermaid {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 1rem; overflow-x: auto; text-align: center;
  }
  pre.mermaid svg { max-width: 100%; height: auto; }
  .mermaid .node:hover, .mermaid .actor:hover { filter: brightness(1.25); cursor: default; }

  /* Diagram kit — .figure/.figcaption wrap every diagram; .iso isometric;
     .arch premium flat; .edge declares a drawn connector (see SKILL.md) */
  .figure {
    background: radial-gradient(ellipse at 30% 0%, var(--fig-glow) 0%, var(--navy-deep) 70%);
    border: 1px solid var(--line); border-radius: 14px; padding: 1.6rem 1.4rem 1rem;
    margin: 1.2rem 0; overflow-x: auto; max-width: none; position: relative;
  }
  .figcaption {
    font-family: ui-monospace, Menlo, monospace; font-size: 0.74rem;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    text-align: center; margin-top: 0.9rem; padding-top: 0.9rem;
    border-top: 1px solid var(--line);
  }
  .figcaption strong { color: var(--accent); font-weight: 600; }
  .figure pre.mermaid { background: none; border: 0; margin: 0; }
  .figure svg.edges {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; overflow: visible;
  }
  .figure svg.edges path { stroke: var(--accent); stroke-width: 1.6; fill: none; opacity: 0.75; }
  .figure svg.edges text {
    fill: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 10.5px;
    letter-spacing: 0.6px; text-transform: uppercase;
  }
  .figure svg.edges .edge-label-bg { fill: var(--navy-deep); stroke: var(--line); stroke-width: 1; rx: 4; opacity: 0.95; }

  /* Baked-palette diagram SVGs are authored navy-only; light mode derives a
     light rendering with a double flip — invert turns dark ground light, the
     180° hue-rotate turns each accent back toward its authored hue — so
     diagrams follow the theme without a second authored variant.
     svg[role="img"] is the baked-diagram convention; mermaid, edge overlays
     and UI icons never carry it.
     .d2 is exempt: it ships both palettes and switches on the same data-theme
     attribute, and it embeds vendor logos that must never be filtered.
     .drawio is exempt for the second half of that reason alone: it is a
     vendor-stencil figure exported light-only onto its own plate, so it has no
     second palette to flip to and its brand fills must survive untouched. */
  html[data-theme="light"] svg[role="img"]:not(.edges):not(.d2):not(.drawio) {
    filter: invert(0.93) hue-rotate(180deg);
  }
  /* Fit-to-screen cap: a figure is read at a glance, so it is bounded by the
     column AND by the viewport height, and the toolbar is how a reader gets past
     that. A replaced element with an intrinsic ratio satisfies both caps at
     once, so the aspect survives whichever one binds and a figure narrower and
     shorter than both keeps its own size — never upscaled. The .fig-viewport
     arms repeat the rule for the scroll box the toolbar script wraps a figure
     in; the cap has to hold before that script runs and in print, where it
     never does. :not(.edges) is defensive — even without it the edges-overlay
     rule out-specifies this one. An inline icon inside figure prose would match
     the p arm: known non-goal (no content uses that pattern; the durable fix is
     an opt-in class from publish.ts, CSS cannot express "this p has no text"). */
  .figure > svg:not(.edges),
  .figure > p > svg:not(.edges),
  .figure > .fig-viewport > svg:not(.edges),
  .figure > .fig-viewport > p > svg:not(.edges) {
    display: block; max-width: 100%; max-height: 60vh;
    width: auto; height: auto; margin-inline: auto;
  }
  .figure p { max-width: none; }
  .fig-viewport { overflow: auto; max-width: 100%; }

  /* Per-figure toolbar — zoom out/in/reset and full screen. Hover reveals it on
     a pointer device; a touch screen has no hover, so there it always shows. */
  .figure.fig-expandable { cursor: zoom-in; }
  /* Clicking a zoomed figure pans it rather than expanding it, so the
     zoom-in cursor would be promising something that no longer happens. */
  .figure.fig-zoomed { cursor: default; }
  .fig-tools {
    position: absolute; top: 0.55rem; right: 0.7rem; z-index: 2;
    display: flex; gap: 0.25rem; opacity: 0; transition: opacity 0.15s;
  }
  .figure:hover .fig-tools, .fig-tools:focus-within { opacity: 1; }
  @media (hover: none) { .fig-tools { opacity: 1; } }
  .fig-tool {
    font-family: ui-monospace, Menlo, monospace; font-size: 0.7rem; line-height: 1;
    color: var(--muted); background: var(--navy-deep);
    border: 1px solid var(--line); border-radius: 6px;
    min-width: 1.5rem; height: 1.5rem; padding: 0 0.3rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .fig-tool:hover:not(:disabled), .fig-tool:focus-visible { color: var(--ink); border-color: var(--accent); }
  .fig-tool:disabled { opacity: 0.4; cursor: default; }
  .fig-lightbox {
    position: fixed; inset: 0; z-index: 70; padding: 4vh 4vw;
    background: color-mix(in srgb, var(--navy-deep) 85%, transparent);
    backdrop-filter: blur(6px);
  }
  .fig-lightbox[hidden] { display: none; }
  .fig-lightbox-body { width: 100%; height: 100%; overflow: auto; }
  .fig-lightbox .figure { width: max-content; max-width: none; margin: 0 auto; cursor: default; }
  .fig-lightbox .figure p { max-width: none; }
  /* Full screen is where a reader goes to escape the fit-to-screen cap, so the
     copy takes its natural size and neither cap applies to it. */
  .fig-lightbox .figure > svg:not(.edges),
  .fig-lightbox .figure > p > svg:not(.edges) {
    max-width: none; max-height: none; width: auto; height: auto;
  }
  .fig-lightbox-close {
    position: fixed; top: 1rem; right: 1rem;
    width: 2.3rem; height: 2.3rem; border-radius: 50%;
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    cursor: pointer; font-size: 0.95rem; line-height: 1; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .fig-lightbox-close:hover { border-color: var(--accent); }
  /* Print sits below every rule it overrides. These selectors tie on specificity
     with the screen ones, so source order is the whole cascade: the same block
     placed above them lost every declaration silently. */
  @media print {
    .fig-lightbox { display: none; }
    .figure > svg:not(.edges), .figure > p > svg:not(.edges),
    .figure > .fig-viewport > svg:not(.edges), .figure > .fig-viewport > p > svg:not(.edges) {
      -webkit-print-color-adjust: exact; print-color-adjust: exact; max-height: none;
    }
    /* A reader can send a zoomed figure to the printer, and the zoom lives in an
       inline height on the scroll box — which paper has no way to scroll. */
    .fig-viewport { overflow: visible; height: auto !important; }
    .fig-tools { display: none; }
  }
  .iso {
    display: grid; grid-template-columns: repeat(3, minmax(7.5rem, 1fr));
    gap: 0.6rem 1.2rem; justify-items: center; padding: 1.6rem 0 0.4rem;
    position: relative; z-index: 1;
  }
  .iso-node { display: flex; flex-direction: column; align-items: center; gap: 1.4rem; }
  .iso-node .tile {
    width: 6.4rem; aspect-ratio: 1; position: relative;
    transform: rotateX(55deg) rotateZ(-45deg); transform-style: preserve-3d;
    transition: transform 0.2s;
  }
  .iso-node:hover .tile { transform: rotateX(55deg) rotateZ(-45deg) translateZ(10px); }
  .iso-node .top {
    position: absolute; inset: 0; border-radius: 14px;
    background: linear-gradient(135deg, var(--node-hi) 0%, var(--node-lo) 100%);
    border: 1px solid var(--node-border); box-shadow: inset 0 0 24px color-mix(in srgb, var(--accent) 7%, transparent);
    transform: translateZ(16px);
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .iso-node:hover .top { border-color: var(--accent); box-shadow: inset 0 0 30px color-mix(in srgb, var(--accent) 25%, transparent); }
  .iso-node .side {
    position: absolute; inset: 0; border-radius: 14px;
    background: var(--tile-side); box-shadow: 0 0 0 1px var(--line);
  }
  .iso-node.hot .top { border-color: var(--accent); box-shadow: inset 0 0 26px color-mix(in srgb, var(--accent) 20%, transparent); }
  .iso-node.gold .top { border-color: var(--gold); box-shadow: inset 0 0 26px color-mix(in srgb, var(--gold) 16%, transparent); }
  .iso-node .glyph {
    width: 46%; height: 46%;
    transform: rotateZ(45deg) rotateX(-40deg);
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
  }
  .iso-node .glyph svg { width: 100%; height: 100%; }
  .iso-node .tag {
    font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem;
    letter-spacing: 0.08em; color: var(--ink);
    background: var(--navy-deep); border: 1px solid var(--line);
    border-radius: 6px; padding: 0.15rem 0.6rem; white-space: nowrap;
  }
  .arch { display: flex; flex-direction: column; margin: 0.5rem 0; position: relative; z-index: 1; }
  .arch-row { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  .arch-node {
    background: linear-gradient(160deg, var(--node-hi), var(--node-lo));
    border: 1px solid var(--node-border); border-radius: 12px;
    padding: 0.8rem 1.1rem 0.7rem; min-width: 9.5rem;
    box-shadow: 0 10px 22px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 color-mix(in srgb, var(--ink) 7%, transparent);
    transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
  }
  .arch-node:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 16px 30px -14px rgba(0,0,0,0.65); }
  .arch-node.hot { border-color: color-mix(in srgb, var(--accent) 65%, transparent); }
  .arch-node.gold { border-color: color-mix(in srgb, var(--gold) 60%, transparent); }
  .arch-node .ic { width: 26px; height: 26px; margin-bottom: 0.35rem; }
  .arch-node .nm { font-weight: 600; font-size: 0.92rem; letter-spacing: -0.01em; }
  .arch-node .ds { color: var(--muted); font-size: 0.76rem; font-family: ui-monospace, Menlo, monospace; }
  .arch-join {
    display: flex; justify-content: center; align-items: center; height: 2.4rem;
    color: var(--accent); font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem;
    letter-spacing: 0.1em; gap: 0.5rem;
  }
  .arch-join::before, .arch-join::after {
    content: ""; width: 2px; height: 100%;
    background: linear-gradient(180deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 50%, transparent);
  }
  [data-tip] { position: relative; }
  [data-tip]:hover::after {
    content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 8px);
    transform: translateX(-50%); white-space: nowrap; z-index: 10;
    background: var(--navy-deep); color: var(--ink); border: 1px solid var(--accent);
    border-radius: 6px; padding: 0.3rem 0.7rem; font-size: 0.75rem;
    font-family: ui-monospace, Menlo, monospace; pointer-events: none;
    box-shadow: 0 6px 18px -8px rgba(0,0,0,0.7);
  }

  /* chrome: theme toggle + toc rail */
  .theme-toggle {
    position: fixed; top: 1rem; right: 1rem; z-index: 50;
    width: 2.3rem; height: 2.3rem; border-radius: 50%;
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, transform 0.2s; padding: 0;
  }
  .theme-toggle:hover { border-color: var(--accent); transform: rotate(15deg); }
  .theme-toggle svg { width: 1.1rem; height: 1.1rem; stroke: var(--ink); fill: none; stroke-width: 1.6; }
  html[data-theme="light"] .theme-toggle .moon { display: none; }
  html:not([data-theme="light"]) .theme-toggle .sun { display: none; }
  /* Named sections, not anonymous dots: a reader should see what a page covers
     without scrolling it. The bar is full-bleed but its contents sit in the
     content column, so the wordmark lines up with the text below it. */
  .secnav {
    position: sticky; top: 0; z-index: 40;
    margin: -3rem -1.25rem 1.9rem; padding: 0 1.25rem;
    background: var(--navy-deep); border-bottom: 1px solid var(--line);
  }
  .secnav[hidden] { display: none; }
  .secnav-in {
    max-width: 64rem; margin: 0 auto; height: 3rem;
    display: flex; align-items: center; gap: 1.1rem;
  }
  .secnav-brand {
    font-family: ui-monospace, Menlo, monospace; font-size: 0.78rem; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink);
    display: flex; align-items: center; gap: 0.56rem; white-space: nowrap;
  }
  .secnav-brand::before {
    content: ""; width: 13px; height: 13px; border-radius: 3px;
    background: var(--accent); box-shadow: inset 0 0 0 2.5px var(--navy-deep);
  }
  .secnav-links {
    margin-left: auto; display: flex; gap: 1.15rem; align-items: center;
    overflow-x: auto; scrollbar-width: none;
  }
  .secnav-links::-webkit-scrollbar { display: none; }
  .secnav-links a {
    flex: none; color: var(--muted); text-decoration: none; white-space: nowrap;
    font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem;
    letter-spacing: 0.05em; text-transform: uppercase;
    padding: 0.2rem 0; border-bottom: 1.5px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }
  .secnav-links a:hover { color: var(--ink); border-bottom-color: var(--accent); }
  .secnav-links a.on { color: var(--accent); border-bottom-color: var(--accent); }
  .secnav .theme-toggle { position: static; flex: none; width: 1.9rem; height: 1.9rem; }
  main h2 { scroll-margin-top: 3.4rem; }
  @media print { .theme-toggle, .secnav { display: none; } }
</style>
</head>
<body>
<button class="theme-toggle" aria-label="Toggle light/dark theme">
  <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M19.4 4.6l-1.8 1.8M6.4 17.6l-1.8 1.8"/></svg>
</button>
<nav class="secnav" id="secNav" aria-label="Sections" hidden><div class="secnav-in" id="secNavIn"></div></nav>
<main>
{{CONTENT}}
<footer>published with <a href="https://agentkit.sbs">agentkit pages</a></footer>
</main>
<script>
  document.querySelector(".theme-toggle").addEventListener("click", () => {
    const html = document.documentElement;
    const next = html.dataset.theme === "light" ? "dark" : "light";
    html.dataset.theme = next;
    // The flip and the re-theme event must survive a sandboxed frame where
    // storage throws; persistence is best-effort there.
    try { localStorage.setItem("agentkit-theme", next); } catch {}
    dispatchEvent(new CustomEvent("agentkit-theme", { detail: next }));
  });

  // A section title is written to be read in place, so it is usually too long
  // for a tab. data-nav on the heading is the author's override; otherwise the
  // title is clipped at a word boundary and the full text stays in the tooltip.
  // A derived tab is always a guess: "One service, one database, no agent, no
  // operator" shortens to "One service", which reads as a complete thought and
  // is not one. Every derived label therefore ends in an ellipsis, so a reader
  // can tell a name the author chose from one the page invented. Name the tab
  // with data-nav and it is used verbatim.
  function navLabel(h) {
    const full = h.textContent.trim();
    if (h.dataset.nav) return h.dataset.nav.trim();
    if (full.length <= 28) return full;
    const clause = full.split(/\s*[,—:(]\s*/)[0];
    const stem = clause.length >= 4 && clause.length <= 28
      ? clause
      : (() => {
        const cut = full.slice(0, 28);
        const at = cut.lastIndexOf(" ");
        return at > 12 ? cut.slice(0, at) : cut;
      })();
    return stem.replace(/[\s,.;:—-]+$/, "") + "…";
  }

  const heads = [...document.querySelectorAll("main h2")];
  if (heads.length >= 3) {
    const bar = document.getElementById("secNav");
    const inner = document.getElementById("secNavIn");
    bar.hidden = false;
    // An author names the product with <div class="brand">; the bar hoists it
    // so the wordmark sits left of the sections, aligned with the text column.
    const brand = document.querySelector("main .brand");
    if (brand) {
      brand.classList.add("secnav-brand");
      brand.classList.remove("brand");
      inner.appendChild(brand);
    }
    const rail = document.createElement("div");
    rail.className = "secnav-links";
    inner.appendChild(rail);
    const toggle = document.querySelector(".theme-toggle");
    if (toggle) inner.appendChild(toggle);
    heads.forEach((h, i) => {
      if (!h.id) h.id = "s" + (i + 1);
      const a = document.createElement("a");
      a.href = "#" + h.id;
      a.textContent = navLabel(h);
      a.title = h.textContent.trim();
      rail.appendChild(a);
    });
    const links = [...rail.children];
    const io = new IntersectionObserver((es) => {
      es.forEach((e) => {
        if (!e.isIntersecting) return;
        const i = heads.indexOf(e.target);
        links.forEach((l, k) => l.classList.toggle("on", k === i));
        // On a narrow viewport the bar scrolls; the active tab has to be
        // brought into it or the highlight is invisible exactly when needed.
        const on = links[i];
        if (on && rail.scrollWidth > rail.clientWidth) {
          const left = on.offsetLeft - rail.clientWidth / 2 + on.offsetWidth / 2;
          rail.scrollTo({ left: Math.max(0, left), behavior: "smooth" });
        }
      });
    }, { rootMargin: "-15% 0px -70% 0px" });
    heads.forEach((h) => io.observe(h));
  }

  function drawEdges() {
    document.querySelectorAll(".figure").forEach((fig) => {
      const edges = [...fig.querySelectorAll(".edge")];
      fig.querySelector("svg.edges")?.remove();
      if (!edges.length) return;
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("class", "edges");
      const fr = fig.getBoundingClientRect();
      const defs = document.createElementNS(ns, "defs");
      defs.innerHTML = '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>';
      svg.appendChild(defs);
      edges.forEach((e) => {
        const a = fig.querySelector("#" + CSS.escape(e.dataset.from));
        const b = fig.querySelector("#" + CSS.escape(e.dataset.to));
        if (!a || !b) return;
        const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
        const x1 = ra.left + ra.width / 2 - fr.left, y1 = ra.top + ra.height / 2 - fr.top;
        const x2 = rb.left + rb.width / 2 - fr.left, y2 = rb.top + rb.height / 2 - fr.top;
        const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
        const t1 = (Math.max(ra.width, ra.height) / 2 + 6) / len, t2 = (Math.max(rb.width, rb.height) / 2 + 10) / len;
        const ax = x1 + dx * t1, ay = y1 + dy * t1, bx = x2 - dx * t2, by = y2 - dy * t2;
        const mx = (ax + bx) / 2, my = (ay + by) / 2;
        const cx = mx - dy * 0.12, cy = my + dx * 0.12;
        const p = document.createElementNS(ns, "path");
        p.setAttribute("d", `M${ax},${ay} Q${cx},${cy} ${bx},${by}`);
        p.setAttribute("marker-end", "url(#ah)");
        p.setAttribute("style", "color: var(--accent)");
        svg.appendChild(p);
        if (e.dataset.label) {
          const tx = document.createElementNS(ns, "text");
          tx.setAttribute("x", cx); tx.setAttribute("y", cy - 5);
          tx.setAttribute("text-anchor", "middle");
          tx.textContent = e.dataset.label;
          svg.appendChild(tx);
        }
      });
      fig.prepend(svg);
    });
  }
  addEventListener("load", drawEdges);
  addEventListener("agentkit-theme", () => setTimeout(drawEdges, 350));
  addEventListener("resize", () => { clearTimeout(window.__et); window.__et = setTimeout(drawEdges, 150); });

  // Accessible figure lightbox: preserve focus and restore natural SVG size.
  const lb = document.createElement("div");
  lb.className = "fig-lightbox";
  lb.hidden = true;
  lb.setAttribute("role", "dialog");
  lb.setAttribute("aria-modal", "true");
  lb.setAttribute("aria-label", "Expanded figure");
  lb.innerHTML = '<div class="fig-lightbox-body"></div><button class="fig-lightbox-close" type="button" aria-label="Close expanded figure">✕</button>';
  document.body.appendChild(lb);
  const lbBody = lb.querySelector(".fig-lightbox-body");
  const lbClose = lb.querySelector(".fig-lightbox-close");
  let restoreFocus = null;
  let restoreOverflow = "";
  let inertSnapshot = [];
  function isolateBackground() {
    inertSnapshot = [...document.body.children]
      .filter((element) => element !== lb)
      .map((element) => ({ element, value: element.getAttribute("inert") }));
    inertSnapshot.forEach(({ element }) => element.setAttribute("inert", ""));
  }
  function restoreBackground() {
    inertSnapshot.forEach(({ element, value }) => {
      if (value === null) element.removeAttribute("inert");
      else element.setAttribute("inert", value);
    });
    inertSnapshot = [];
  }
  function closeLightbox() {
    if (lb.hidden) return;
    lb.hidden = true;
    document.body.style.overflow = restoreOverflow;
    restoreBackground();
    lbBody.replaceChildren();
    restoreFocus?.focus();
    restoreFocus = null;
  }
  // Figure zoom. The CSS fits every figure into the viewport, and the toolbar is
  // how a reader gets past that cap. A zoomed figure grows inside a scroll box
  // whose own footprint never changes, so zooming never widens the page.
  const ZOOM_STEP = 1.25;
  const ZOOM_MIN = 0.5;
  const ZOOM_MAX = 4;
  const ZOOM_PROPS = ["width", "height", "maxWidth", "maxHeight"];
  const TOOLS = [["out", "−", "Zoom out"], ["in", "+", "Zoom in"], ["reset", "1:1", "Reset zoom"], ["full", "⤢", "Expand figure"]];
  const ZOOMABLE = ':scope > svg[role="img"], :scope > p > svg[role="img"],'
    + ' :scope > .fig-viewport > svg[role="img"], :scope > .fig-viewport > p > svg[role="img"]';

  function zoomTargets(fig) {
    return [...fig.querySelectorAll(ZOOMABLE)];
  }

  function applyZoom(fig, factor) {
    const svg = zoomTargets(fig)[0];
    if (!svg) return;
    const box = fig.querySelector(".fig-viewport");
    // Rounded, or repeated division leaves 0.6400000000000001 in the attribute
    // and the reset comparison below has to guess at a tolerance.
    const next = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(factor * 1e4) / 1e4));
    // The fitted size is re-measured from a cleared state on every step, so a
    // resized window or a re-rendered figure never scales off a stale baseline.
    if (box) box.style.height = "";
    for (const prop of ZOOM_PROPS) svg.style[prop] = "";
    const fit = svg.getBoundingClientRect();
    fig.dataset.figZoom = String(next);
    if (next !== 1) {
      if (box) box.style.height = Math.round(fit.height * Math.min(1, next)) + "px";
      svg.style.maxWidth = "none";
      svg.style.maxHeight = "none";
      svg.style.width = Math.round(fit.width * next) + "px";
      svg.style.height = Math.round(fit.height * next) + "px";
    }
    fig.classList.toggle("fig-zoomed", next !== 1);
    fig.querySelectorAll(".fig-tool").forEach((button) => {
      const bound = { in: next >= ZOOM_MAX, out: next <= ZOOM_MIN, reset: next === 1 }[button.dataset.figTool];
      if (bound !== undefined) button.disabled = bound;
    });
  }

  function figTools(fig, expanded) {
    const zoomable = zoomTargets(fig).length === 1;
    const bar = document.createElement("div");
    bar.className = "fig-tools";
    bar.setAttribute("role", "group");
    bar.setAttribute("aria-label", "Figure controls");
    for (const [action, glyph, label] of TOOLS) {
      if (action === "full" ? expanded : !zoomable) continue;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "fig-tool";
      button.dataset.figTool = action;
      button.textContent = glyph;
      button.disabled = action === "reset";
      button.setAttribute("aria-label", label);
      bar.appendChild(button);
    }
    if (!bar.children.length) return null;
    fig.appendChild(bar);
    return bar;
  }

  function decorateFigure(fig, expanded) {
    const targets = zoomTargets(fig);
    // The scroll box is what keeps a zoomed figure from widening the page. Full
    // screen has no page to protect and the lightbox already scrolls itself.
    if (targets.length === 1 && !expanded) {
      const child = targets[0].parentElement === fig ? targets[0] : targets[0].parentElement;
      const box = document.createElement("div");
      box.className = "fig-viewport";
      child.replaceWith(box);
      box.appendChild(child);
    }
    fig.dataset.figZoom = "1";
    const bar = figTools(fig, expanded);
    bar?.addEventListener("click", (event) => {
      const button = event.target.closest(".fig-tool");
      const action = button?.dataset.figTool;
      if (!action) return;
      if (action === "full") openLightbox(fig, button);
      else if (action === "reset") applyZoom(fig, 1);
      else applyZoom(fig, Number(fig.dataset.figZoom) * (action === "in" ? ZOOM_STEP : 1 / ZOOM_STEP));
    });
    if (expanded) return;
    fig.classList.add("fig-expandable");
    fig.addEventListener("click", (event) => {
      if (event.target.closest("a, button")) return;
      // A zoomed figure is being read inside its own box, not opened.
      if (fig.dataset.figZoom !== "1") return;
      if (window.getSelection()?.toString()) return;
      openLightbox(fig, bar?.querySelector('[data-fig-tool="full"]') ?? null);
    });
  }

  function openLightbox(fig, trigger) {
    const clone = fig.cloneNode(true);
    clone.classList.remove("fig-expandable");
    clone.querySelector(".fig-tools")?.remove();
    // The copy is rebuilt from the figure's own markup: the scroll box and every
    // inline size the toolbar left on it belong to the fitted page, not here,
    // and an inline max-width would out-specify the lightbox's own sizing.
    clone.querySelectorAll(".fig-viewport").forEach((box) => box.replaceWith(...box.childNodes));
    clone.querySelectorAll("svg").forEach((svg) => {
      for (const prop of ZOOM_PROPS) svg.style[prop] = "";
    });
    restoreFocus = trigger;
    restoreOverflow = document.body.style.overflow;
    lbBody.replaceChildren(clone);
    decorateFigure(clone, true);
    isolateBackground();
    lb.hidden = false;
    document.body.style.overflow = "hidden";
    lbClose.focus();
    drawEdges();
  }
  document.querySelectorAll(".figure").forEach((fig) => decorateFigure(fig, false));
  lb.addEventListener("click", (e) => {
    if (e.target.closest(".fig-lightbox-close") || !e.target.closest(".figure")) closeLightbox();
  });
  addEventListener("keydown", (e) => {
    if (lb.hidden) return;
    if (e.key === "Escape") {
      e.preventDefault();
      closeLightbox();
      return;
    }
    if (e.key !== "Tab") return;
    const focusable = [...lb.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])')];
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });
</script>
</body>
</html>
