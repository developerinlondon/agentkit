name: Cross-platform CI

on:
  pull_request:
  # The merge queue validates the projected merge result; the full suite runs
  # there (the event is not a pull_request), which is what a queue is for.
  merge_group:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the worker and the docs site from this ref"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pick-runners:
    name: Pick runners
    runs-on: ubuntu-24.04
    # The macOS job is the long pole — 7 to 12 minutes hosted. A self-hosted Mac
    # cuts that, but a self-hosted runner must never execute code from a fork on
    # a public repository, and GitHub does not fall back when one is offline: a
    # job targeting an absent label queues instead. So the choice is made here,
    # before dispatch, and every uncertain answer resolves to the hosted runner.
    #
    # `administration` is not a permission workflow YAML can grant GITHUB_TOKEN —
    # naming it fails the whole workflow at parse. Listing runners needs it, so
    # the pick reads ADMIN_READ_TOKEN (fine-grained PAT, Administration: read)
    # when present and otherwise probes with the default token; a 403 lands in
    # the same fallback as an offline runner. Forks never see the secret, which
    # composes with the fork guard: fork PRs resolve to hosted twice over.
    # No checkout happens here, so the job needs nothing from GITHUB_TOKEN.
    permissions: {}
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Choose the macOS runner
        id: pick
        env:
          GH_TOKEN: ${{ secrets.ADMIN_READ_TOKEN || github.token }}
          # Identity, not the .fork flag: a null head.repo (deleted fork) must
          # compare unequal and land on hosted, and non-PR events stay false so
          # main and tag pushes can still use the Mac.
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          mac='["macos-15"]'
          if [ "$IS_FORK" = 'true' ]; then
            echo 'fork pull request: hosted macOS only'
          elif online=$(gh api "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" \
              --jq '[.runners[] | select(.status=="online" and .busy==false)
                     | select((["self-hosted","macOS","ARM64"] - [.labels[].name]) | length == 0)] | length') \
            && [ "${online:-0}" -gt 0 ]; then
            mac='["self-hosted","macOS","ARM64"]'
            echo "self-hosted macOS available ($online idle)"
          else
            echo 'no idle self-hosted macOS runner: falling back to hosted'
          fi
          printf 'matrix=[["ubuntu-24.04"],%s]\n' "$mac" >> "$GITHUB_OUTPUT"

  affected:
    name: Affected tests (${{ join(matrix.os, ' ') }})
    needs: pick-runners
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    # Critical changes escalate this job to the full suite, which exceeds 30
    # minutes on the self-hosted Mac — the budget must match that path.
    timeout-minutes: 50
    env:
      MOON_BASE: ${{ github.event.pull_request.base.sha }}
      MOON_HEAD: ${{ github.event.pull_request.head.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.pick-runners.outputs.matrix) }}
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install pinned Moon and Bun toolchains
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        env:
          # proto resolves tool versions against the GitHub API; the self-hosted
          # Mac shares a datacenter IP whose anonymous quota two runs can drain,
          # and an empty version list fails the install with "0.0.0".
          GITHUB_TOKEN: ${{ github.token }}
        with:
          auto-install: true

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Install the pinned d2 renderer
        uses: ./.github/actions/install-d2
        with:
          version: 0.7.1

      - name: Install the pinned dprint formatter
        uses: ./.github/actions/install-dprint
        with:
          version: 0.55.2

      - name: Validate test slice coverage
        run: bun run test:slices

      - name: Select critical or affected test mode
        id: test-mode
        run: |
          if moon query affected | jq -e '.tasks | has("agentkit:test-full")' >/dev/null; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=affected' >> "$GITHUB_OUTPUT"
          fi

      - name: Run full suite for critical changes
        if: steps.test-mode.outputs.mode == 'full'
        run: moon ci agentkit:test-full

      - name: Run affected Moon tasks
        if: steps.test-mode.outputs.mode == 'affected'
        run: moon ci

  full:
    name: Full suite (${{ join(matrix.os, ' ') }})
    needs: pick-runners
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    # Generous on purpose: the slowest pool machine with cold caches once blew
    # a 30-minute ceiling on a tag push, and a timed-out full suite cancels the
    # whole release. A slow release beats a dead one.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.pick-runners.outputs.matrix) }}
    steps:
      # A tag names a commit the main-push run already tested — same SHA, same
      # tree, same workflow — so a green run for the exact SHA stands in for a
      # re-run. Tags only: an untested SHA (direct tag) still runs everything,
      # and any lookup failure falls through to running the suite.
      - name: Reuse a green run for this exact commit
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=false
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            runs=$(curl -sS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=success&per_page=20" \
              || true)
            if [ -n "$runs" ] && printf '%s' "$runs" | jq -e \
              --arg wf "$GITHUB_WORKFLOW" --arg id "$GITHUB_RUN_ID" \
              '[.workflow_runs[]? | select(.name == $wf and (.id | tostring) != $id)] | length > 0' \
              >/dev/null 2>&1; then
              tested=true
              echo "commit $GITHUB_SHA already passed a full $GITHUB_WORKFLOW run — reusing it"
            fi
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

      - name: Check out full history
        if: steps.reuse.outputs.tested != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install pinned Moon and Bun toolchains
        if: steps.reuse.outputs.tested != 'true'
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        env:
          # proto resolves tool versions against the GitHub API; the self-hosted
          # Mac shares a datacenter IP whose anonymous quota two runs can drain,
          # and an empty version list fails the install with "0.0.0".
          GITHUB_TOKEN: ${{ github.token }}
        with:
          auto-install: true

      - name: Install dependencies from the lockfile
        if: steps.reuse.outputs.tested != 'true'
        run: bun install --frozen-lockfile

      - name: Install the pinned d2 renderer
        if: steps.reuse.outputs.tested != 'true'
        uses: ./.github/actions/install-d2
        with:
          version: 0.7.1

      - name: Install the pinned dprint formatter
        if: steps.reuse.outputs.tested != 'true'
        uses: ./.github/actions/install-dprint
        with:
          version: 0.55.2

      - name: Run complete suite
        if: steps.reuse.outputs.tested != 'true'
        run: moon run agentkit:test-full

  docs:
    name: Docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The docs label the current release. A shallow checkout has no tags, so
          # a manual publish from main would show a bare "Latest".
          fetch-tags: true
          fetch-depth: 0

      - name: Install pinned Moon, Bun and Node toolchains
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Install Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f # v3.0.0
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Check the generated tables against the tree
        run: bun run scripts/sync-docs-facts.ts --check

      - name: Run the docs test slice
        run: bun test tests/docs/

      # Builds the data the tables render from, the version list the picker
      # offers, and the site; then refuses a dangling internal link, which Hugo
      # does not check itself.
      - name: Build the docs site
        working-directory: docs/hextra
        run: HUGO_BIN=hugo ./build.sh

      # Needs the build, so it is a check rather than a test: an extension nobody
      # listed is invisible to a hand-maintained fixture.
      - name: Check every built file is publishable
        run: bun run scripts/check-dist-assets.ts

      # The marketing build otherwise runs only inside the publish job, where a
      # regression surfaces at release time instead of on the PR.
      - name: Build the marketing site
        run: bash pages/site/build.sh

  worker-publish:
    name: Publish the Pages worker
    # A publish is a release act or an explicit one, never a side effect of a
    # merge: installs resolve to the newest tag, so `/docs/` must describe the
    # release people actually get rather than whatever landed on main last. The
    # manual trigger is the safety valve — a false statement on a docs site
    # cannot wait for the next release.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.publish)
    # Run for releases and explicit publishes rather than only when
    # pages/worker changes. A drifted worker is invisible until a deploy fails
    # against it, which is exactly how the docs publish path broke the first
    # time.
    needs:
      - full
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The docs label the current release. A shallow checkout has no tags, so
          # a manual publish from main would show a bare "Latest".
          fetch-tags: true
          fetch-depth: 0

      - name: Install pinned Moon, Bun and Node toolchains
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Install worker dependencies from the lockfile
        run: bun install --frozen-lockfile --cwd pages/worker

      - name: Apply Pages D1 migrations
        working-directory: pages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'worker: Cloudflare D1 credentials are not configured' >&2
            exit 1
          fi
          node node_modules/wrangler/bin/wrangler.js d1 migrations apply agentkit-pages --remote

      - name: Deploy the worker
        working-directory: pages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'worker: Cloudflare credentials are not configured' >&2
            exit 1
          fi
          # wrangler under node, never bun: under bun it exits 0 having done nothing.
          node node_modules/wrangler/bin/wrangler.js deploy

  docs-publish:
    name: Publish the docs site
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.publish)
    # Publishing waits for the whole suite, not just the docs slice: without this
    # the deploy races the tests and can put a site live that they then reject.
    # It also waits for the worker, which must be able to accept the upload
    # before the upload is attempted.
    needs:
      - docs
      - full
      - worker-publish
    runs-on: ubuntu-24.04
    # The publish builds every archived version from its tag and uploads all of
    # them; at the archive cap that is well past the old 20-minute bound.
    timeout-minutes: 45
    steps:
      - name: Check out the commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The docs label the current release. A shallow checkout has no tags, so
          # a manual publish from main would show a bare "Latest".
          fetch-tags: true
          fetch-depth: 0

      - name: Install pinned Moon, Bun and Node toolchains
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Install Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f # v3.0.0
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Build and publish the docs site
        env:
          AGENTKIT_SITE_TOKEN: ${{ secrets.AGENTKIT_SITE_TOKEN }}
        run: |
          if [ -z "$AGENTKIT_SITE_TOKEN" ]; then
            echo 'docs: AGENTKIT_SITE_TOKEN is not configured' >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.config/agentkit"
          umask 077
          printf '%s' "$AGENTKIT_SITE_TOKEN" > "$HOME/.config/agentkit/site-token"
          (cd docs/hextra && HUGO_BIN=hugo ./build.sh && ./deploy.sh)

  site-publish:
    name: Publish the marketing site
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.publish)
    # Same ordering as the docs: the worker must be able to serve what is about
    # to be uploaded before the upload happens.
    needs:
      - full
      - worker-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: fetch-tags alone on a depth-1 checkout downloads no
          # tags (auto-follow only covers downloaded objects), and the dispatch
          # path publishes from a branch where only git describe knows the
          # version. The tag path short-circuits via the ref name below.
          fetch-tags: true
          fetch-depth: 0

      - name: Build and publish the marketing site
        env:
          AGENTKIT_SITE_TOKEN: ${{ secrets.AGENTKIT_SITE_TOKEN }}
          AGENTKIT_SITE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          if [ -z "$AGENTKIT_SITE_TOKEN" ]; then
            echo 'site: AGENTKIT_SITE_TOKEN is not configured' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$AGENTKIT_SITE_TOKEN" > "$RUNNER_TEMP/site-token"
          AGENTKIT_SITE_TOKEN_FILE="$RUNNER_TEMP/site-token" bash ./pages/site/deploy.sh

  release:
    name: Publish the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    # The release is the last act of a tag push: it must name a candidate that is
    # tested AND live, so it waits for every publish job rather than racing them.
    needs:
      - full
      - worker-publish
      - docs-publish
      - site-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "release: $TAG already exists — leaving it untouched"
            exit 0
          fi
          gh release create "$TAG" -R "$REPO" --title "$TAG" --generate-notes --verify-tag

  ci-gate:
    name: CI gate
    # Not on cancellation: a superseded run's test jobs die cancelled, and a
    # gate that still runs then reports a failure for work nobody needs.
    if: always() && !cancelled()
    needs:
      - affected
      - docs
      - docs-publish
      - full
      - release
      - site-publish
      - worker-publish
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the applicable test jobs
        env:
          AFFECTED_RESULT: ${{ needs.affected.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          DOCS_PUBLISH_RESULT: ${{ needs.docs-publish.result }}
          WORKER_PUBLISH_RESULT: ${{ needs.worker-publish.result }}
          SITE_PUBLISH_RESULT: ${{ needs.site-publish.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          FULL_RESULT: ${{ needs.full.result }}
        run: |
          if [ "$DOCS_RESULT" != 'success' ]; then
            echo "Docs result: $DOCS_RESULT"
            exit 1
          fi
          PUBLISH_EXPECTED=0
          case "$GIT_REF" in refs/tags/v*) PUBLISH_EXPECTED=1 ;; esac
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$PUBLISH_INPUT" = 'true' ]; then
            PUBLISH_EXPECTED=1
          fi
          if [ "$PUBLISH_EXPECTED" = '1' ]; then
            if [ "$DOCS_PUBLISH_RESULT" != 'success' ] || [ "$WORKER_PUBLISH_RESULT" != 'success' ] \
              || [ "$SITE_PUBLISH_RESULT" != 'success' ]; then
              echo "Publish results: worker=$WORKER_PUBLISH_RESULT docs=$DOCS_PUBLISH_RESULT site=$SITE_PUBLISH_RESULT"
              exit 1
            fi
          elif [ "$DOCS_PUBLISH_RESULT" != 'skipped' ] || [ "$WORKER_PUBLISH_RESULT" != 'skipped' ] \
            || [ "$SITE_PUBLISH_RESULT" != 'skipped' ]; then
            echo "Publish ran without a release tag or an explicit request: worker=$WORKER_PUBLISH_RESULT docs=$DOCS_PUBLISH_RESULT site=$SITE_PUBLISH_RESULT"
            exit 1
          fi
          case "$GIT_REF" in
          refs/tags/v*)
            if [ "$RELEASE_RESULT" != 'success' ]; then
              echo "Release result: $RELEASE_RESULT"
              exit 1
            fi
            ;;
          *)
            if [ "$RELEASE_RESULT" != 'skipped' ]; then
              echo "Release ran without a release tag: $RELEASE_RESULT"
              exit 1
            fi
            ;;
          esac
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            if [ "$AFFECTED_RESULT" != 'success' ] || [ "$FULL_RESULT" != 'skipped' ]; then
              echo "PR results: affected=$AFFECTED_RESULT full=$FULL_RESULT"
              exit 1
            fi
          else
            if [ "$AFFECTED_RESULT" != 'skipped' ] || [ "$FULL_RESULT" != 'success' ]; then
              echo "Non-PR results: affected=$AFFECTED_RESULT full=$FULL_RESULT"
              exit 1
            fi
          fi
