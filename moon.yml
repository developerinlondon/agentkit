id: "agentkit"

fileGroups:
  ciConfig:
    - ".mise.toml"
    - ".moon/toolchains.yml"
    - ".prototools"
    - "bun.lock"
    - "moon.yml"
    - "package.json"
    - "scripts/check-test-slices.ts"
    - "scripts/run-test-slices.ts"

  criticalInputs:
    - ".agentkit/config.yaml"
    - ".agentkit/product.yaml"
    - ".agentkit/review-policy.json"
    - ".claude-plugin/marketplace.json"
    - ".github/actions/**/*"
    - ".github/workflows/**/*"
    - ".moon/**/*"
    - ".prototools"
    - "bun.lock"
    - "config.example.yaml"
    - "docs/review-process.md"
    - "hooks/**/*"
    - "install.sh"
    - "instructions/coding-discipline.md"
    - "instructions/evidence-gated-review.md"
    - "lib/install-platform.sh"
    - "lib/skill-kits.sh"
    - "moon.yml"
    - "package.json"
    - "plugins-cc/agentkit-product/skills/product-review/**/*"
    - "plugins-cc/agentkit/.claude-plugin/plugin.json"
    - "plugins-cc/agentkit/hooks/**/*"
    - "plugins-cc/agentkit-adversarial-review/**/*"
    - "plugins-cc/agentkit/skills/autonomous-workflow/**/*"
    - "plugins-cc/agentkit/skills/product-review/**/*"
    - "plugins-cc/agentkit/skills/test-driven-development/**/*"
    - "plugins/*.ts"
    - "policies/**/*"
    - "scripts/check-test-slices.ts"
    - "scripts/product-command"
    - "scripts/run-test-slices.ts"
    - "scripts/skill-kits.ts"
    - "scripts/sync-cc-plugin.sh"
    - "skills/KITS"
    - "skills/adversarial-review/**/*"
    - "skills/autonomous-workflow/**/*"
    - "skills/product-review/**/*"
    - "skills/test-driven-development/**/*"
    - "tests/agentkit-plugin.test.ts"
    - "tests/codex-review-hooks.test.ts"
    - "tests/hook-supervisor.test.ts"
    - "tests/install-claude-plugin.test.ts"
    - "tests/install-tools.test.ts"
    - "tests/review-disciplines.test.ts"
    - "tests/review-gate.test.ts"
    - "tests/review-police.test.ts"
    - "tests/review-profile.test.ts"
    - "tests/test-slices.test.ts"
    - "tools/review-gate"
    - "tools/review-profile"

  # The generated tables are derived from the enforcement tree, so a change there
  # has to re-run the drift check. Without these the docs slice stayed green while
  # the thing it documents moved underneath it.
  siteInputs:
    - "pages/site/**/*"
    - "docs/hextra/content/**/*"
    - "tests/site/**/*"

  docsInputs:
    - "docs/hextra/build.sh"
    - "docs/hextra/deploy.sh"
    - "docs/hextra/content/**/*"
    - "docs/hextra/data/**/*"
    - "docs/hextra/hugo.yaml"
    - "docs/hextra/layouts/**/*"
    - "docs/hextra/scripts/**/*"
    - "hooks/**/*"
    - "plugins/*.ts"
    - "plugins-cc/*/hooks/**/*"
    - "policies/**/*"
    - "scripts/sync-docs-facts.ts"
    - "skills/**/*"
    - "tools/**/*"
    - "tests/docs/**/*"

  diagramInputs:
    - "bun.lock"
    - "package.json"
    - "plugins-cc/agentkit/skills/diagram/**/*"
    - "skills/diagram/**/*"
    - "skills/publish-page/lint.ts"
    - "skills/publish-page/themes/doc.html"
    - "tests/diagram/**/*"

  hookInputs:
    - ".claude-plugin/**/*"
    - "hooks/**/*"
    - "plugins/**/*"
    - "plugins-cc/agentkit/.claude-plugin/**/*"
    - "plugins-cc/agentkit/hooks/**/*"
    - "plugins-cc/agentkit/server/**/*"
    - "policies/**/*"
    - "scripts/sync-cc-plugin.sh"
    - "tests/agentkit-plugin.test.ts"
    - "tests/coding-police-hook.test.ts"
    - "tests/coding-police.test.ts"
    - "tests/comment-police-hook.test.ts"
    - "tests/comment-police.test.ts"
    - "tests/git-police-hygiene.test.ts"
    - "tests/git-police.test.ts"
    - "tests/hook-payload-compat.test.ts"
    - "tests/hook-supervisor.test.ts"
    - "tests/hooks/**/*"
    - "tests/kubectl-police.test.ts"
    - "tests/mr-police.test.ts"
    - "tests/pkg-police.test.ts"
    - "tests/version-police.test.ts"

  installInputs:
    - "config.example.yaml"
    - "bootstrap.sh"
    - "scripts/install-nested.sh"
    - "hooks/**/*"
    - "install.sh"
    - "kits/**/*"
    - "instructions/**/*"
    - "lib/**/*"
    - "plugins-cc/**/*"
    - "rules/**/*"
    - "skills/**/*"
    - "tests/install-claude-plugin.test.ts"
    - "tests/install-hooks.test.ts"
    - "tests/install-platform.test.ts"
    - "tests/install-prompt.test.ts"
    - "tests/install-shared-root.test.ts"
    - "tests/install-tools.test.ts"
    - "tests/install/**/*"
    - "tools/**/*"

  integrationInputs:
    - ".github/actions/**/*"
    - ".github/workflows/**/*"
    - ".moon/**/*"
    - "plugins-cc/infra-tools/**/*"
    - "tests/infra-tools-mcp.test.ts"
    - "tests/test-slices.test.ts"

  memoryInputs:
    - "hooks/claude/memory-index.sh"
    - "hooks/claude/memory-inject.sh"
    - "hooks/claude/lib/**/*"
    - "plugins-cc/agentkit-brain/**/*"
    - "skills/meditate/**/*"
    - "skills/reflect/**/*"
    - "skills/ruminate/**/*"
    - "tests/memory/**/*"

  productInputs:
    - "hooks/claude/pages-police.sh"
    - "pages/worker/**/*"
    - "plugins-cc/agentkit-product/skills/product-intelligence/**/*"
    - "plugins-cc/agentkit/hooks/pages-police.sh"
    - "plugins-cc/agentkit/skills/product-intelligence/**/*"
    - "plugins-cc/agentkit/skills/publish-page/**/*"
    - "skills/product-intelligence/**/*"
    - "skills/publish-page/**/*"
    - "tests/product-intelligence/**/*"
    - "tests/publish-page/**/*"

  resourceInputs:
    - "hooks/claude/resource-police.sh"
    - "instructions/resource-safety.md"
    - "plugins/resource-police.ts"
    - "plugins-cc/agentkit/hooks/resource-police.sh"
    - "plugins-cc/agentkit/skills/resource-safe-execution/**/*"
    - "plugins-cc/agentkit/tools/bounded-run"
    - "policies/codex/delegation-police.rules"
    - "policies/codex/resource-police.rules"
    - "skills/resource-safe-execution/**/*"
    - "tests/fixtures/resource-commands.ts"
    - "tests/resource-police.test.ts"
    - "tests/resource-run.integration.test.ts"
    - "tests/resource-run.test.ts"
    - "tests/resource-safety-assets.test.ts"
    - "tools/bounded-run"

  reviewInputs:
    - ".agentkit/config.yaml"
    - ".agentkit/review-policy.json"
    - "BUILD-DISCIPLINE.md"
    - "config.example.yaml"
    - "hooks/claude/fail-closed-hook.sh"
    - "hooks/claude/review-police.sh"
    - "hooks/codex/**/*"
    - "instructions/coding-discipline.md"
    - "instructions/evidence-gated-review.md"
    - "plugins-cc/agentkit-product/skills/product-review/**/*"
    - "plugins-cc/agentkit/hooks/fail-closed-hook.sh"
    - "plugins-cc/agentkit/hooks/review-police.sh"
    - "plugins-cc/agentkit-adversarial-review/**/*"
    - "plugins-cc/agentkit/skills/autonomous-workflow/**/*"
    - "plugins-cc/agentkit/skills/product-review/**/*"
    - "plugins-cc/agentkit/skills/test-driven-development/**/*"
    - "scripts/bash-status-check"
    - "scripts/lib/test-verdict.sh"
    - "scripts/mutate"
    - "scripts/preflight"
    - "scripts/product-command"
    - "skills/adversarial-review/**/*"
    - "skills/autonomous-workflow/**/*"
    - "skills/product-review/**/*"
    - "skills/test-driven-development/**/*"
    - "tests/build/**/*"
    - "tests/codex-review-hooks.test.ts"
    - "tests/probe-cases.txt"
    - "tests/product-command.test.ts"
    - "tests/review-disciplines.test.ts"
    - "tests/review-gate.test.ts"
    - "tests/review-police.test.ts"
    - "tests/review-profile.test.ts"
    - "tools/review-gate"
    - "tools/review-profile"

  sessionInputs:
    - "install.sh"
    - "tests/session/**/*"
    - "tools/agent-session"

  tasteInputs:
    - "config.example.yaml"
    - "hooks/claude/lib/**/*"
    - "hooks/claude/taste-police.sh"
    - "plugins-cc/agentkit/hooks/taste-police.sh"
    - "plugins/taste-police.ts"
    - "skills/taste/**/*"
    - "tests/taste/**/*"

  wipInputs:
    - "hooks/claude/lib/hook-input.sh"
    - "hooks/claude/plan-police.sh"
    - "skills/wip/**/*"
    - "tests/wip/**/*"
    - "tools/plan-gate"
    - "tools/wip"

tasks:
  preflight:
    command: "scripts/preflight"
    options:
      cache: false

  check-test-slices:
    command: "bun run scripts/check-test-slices.ts --check"

  test-diagram:
    command: "bun run scripts/check-test-slices.ts diagram"
    inputs:
      - "group://ciConfig"
      - "group://diagramInputs"

  test-site:
    command: "bun run scripts/check-test-slices.ts site"
    inputs:
      - "group://ciConfig"
      - "group://siteInputs"

  test-docs:
    command: "bun run scripts/check-test-slices.ts docs"
    inputs:
      - "group://ciConfig"
      - "group://docsInputs"

  test-hooks:
    command: "bun run scripts/check-test-slices.ts hooks"
    inputs:
      - "group://ciConfig"
      - "group://hookInputs"

  test-install:
    command: "bun run scripts/check-test-slices.ts install"
    inputs:
      - "group://ciConfig"
      - "group://installInputs"

  test-integrations:
    command: "bun run scripts/check-test-slices.ts integrations"
    inputs:
      - "group://ciConfig"
      - "group://integrationInputs"

  test-memory:
    command: "bun run scripts/check-test-slices.ts memory"
    inputs:
      - "group://ciConfig"
      - "group://memoryInputs"

  test-product:
    command: "bun run scripts/check-test-slices.ts product"
    inputs:
      - "group://ciConfig"
      - "group://productInputs"

  test-resources:
    command: "bun run scripts/check-test-slices.ts resources"
    inputs:
      - "group://ciConfig"
      - "group://resourceInputs"

  test-review:
    command: "bun run scripts/check-test-slices.ts review"
    inputs:
      - "group://ciConfig"
      - "group://reviewInputs"

  test-session:
    command: "bun run scripts/check-test-slices.ts session"
    inputs:
      - "group://ciConfig"
      - "group://sessionInputs"

  test-taste:
    command: "bun run scripts/check-test-slices.ts taste"
    inputs:
      - "group://ciConfig"
      - "group://tasteInputs"

  test-wip:
    command: "bun run scripts/check-test-slices.ts wip"
    inputs:
      - "group://ciConfig"
      - "group://wipInputs"

  test-full:
    command: "bun run scripts/run-test-slices.ts"
    inputs:
      - "group://criticalInputs"
