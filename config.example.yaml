# Agentkit Configuration
# Copy to: ~/.config/agentkit/config.yaml
# XDG_CONFIG_HOME is respected if set.
#
# comment-police, coding-police and format-police BLOCK an edit (exit 2) when
# they find a violation — exit 0 would have their output discarded. Turn one or
# all of them off for a session with:
#   AGENTKIT_SKIP_HOOKS=coding-police
#   AGENTKIT_SKIP_HOOKS=all

git-police:
  branch-protection:
    # Repos where direct commits/pushes to main/master are allowed.
    # Use the repo name (e.g. "brain") or owner/name (e.g. "myorg/brain").
    # Partial matches are supported — "brain" matches "myorg/brain".
    allowed-repos: []
    # Example:
    #   allowed-repos:
    #     - brain
    #     - my-notes

coding-police:
  # Maximum lines per file before warning to split.
  max-file-lines: 1000

  # Maximum lines per function/method before warning to decompose.
  max-function-lines: 100

  # Minimum identical consecutive lines to flag as duplicate code.
  min-duplicate-lines: 6

  # Maximum exports per file before warning about single responsibility.
  max-exports-per-file: 15

  # Maximum source files in one directory before warning to split into
  # domain subfolders. Only fires when a Write creates a new source file;
  # editing an existing file never triggers it. Set to 0 to disable.
  max-dir-files: 15

  # File path patterns to exclude from checks. Use this for homogeneous
  # one-file-per-item collections (routes/, migrations/) that legitimately
  # outgrow max-dir-files without being a mixed-concerns monolith.
  exclude-patterns: []
  # Example:
  #   exclude-patterns:
  #     - generated/
  #     - __snapshots__/
  #     - routes/
  #     - migrations/

pkg-police:
  # Set to false to disable bun enforcement (allows npm/npx/yarn/pnpm).
  enabled: true
  # Example:
  #   enabled: false

version-police:
  # Set to false to disable stale-major dependency-pin blocking.
  # Can also be disabled via AGENTKIT_SKIP_HOOKS=version-police.
  enabled: true

  # Packages exempted from the major-behind check (deliberate pins).
  # Applies to every manifest, including package.json (which has no comments).
  # Exact names or "*" globs are supported.
  exceptions: []
  # Example:
  #   exceptions:
  #     - serde
  #     - "@types/*"

comment-police:
  # Maximum lines in a single body comment block before warning.
  max-block-lines: 6

  # Maximum lines in a top-of-file comment header before warning.
  # ("Tutorial-style" headers belong in the README, not in the file.)
  max-header-lines: 10

  # Maximum comment-to-(comment+code) line ratio per file before warning.
  max-comment-ratio: 0.3

  # Regex patterns flagged as rotting references (PR / plan / commit
  # references belong in the PR description / commit message, not in code).
  forbidden-patterns:
    - 'Plan-?\d+'
    - 'PR\s*#?\d+'
    - 'closes\s*#\d+'
    - 'fixes\s*#\d+'
    - 'TODO[: ]+(for|after|once)\b'
    - "as part of (this|the) (PR|MR|fix)"

  # File path patterns to exclude from checks.
  exclude-patterns: []
  # Example:
  #   exclude-patterns:
  #     - vendor/
  #     - generated/
