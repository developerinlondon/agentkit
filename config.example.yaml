# Agentkit Configuration
# Copy to: ~/.config/agentkit/config.yaml
# XDG_CONFIG_HOME is respected if set.
#
# comment-police, coding-police and format-police BLOCK an edit (exit 2) when
# they find a violation — exit 0 would have their output discarded. Turn one or
# all of them off for a session with:
#   AGENTKIT_SKIP_HOOKS=coding-police
#   AGENTKIT_SKIP_HOOKS=all

# Review effort controls orchestration, not merge authority. A repository's
# target-owned .agentkit/review-policy.json can require stricter evidence and
# cannot be weakened here. Repositories may override this section in
# .agentkit/config.yaml.
review:
  # fast: primary review for non-trivial work; specialist/product only on narrow triggers
  # balanced: one primary review by default; extra lanes for critical/user-facing/release work
  # strict: primary + specialist + product lanes, full local checks, and CI reruns
  profile: balanced

  # Granular overrides. Delete a key to inherit the selected profile.
  # primary-review: nontrivial
  # specialist-review: critical
  # product-review: triggered
  # ci-evidence: reuse
  # local-checks: affected
  # evidence-note: always

git-police:
  branch-protection:
    # Repos where direct commits/pushes to main/master are allowed.
    # Use the repo name (e.g. "brain") or owner/name (e.g. "myorg/brain").
    # Partial matches are supported — "brain" matches "myorg/brain".
    allowed-repos: []
    # Example:
    #   allowed-repos:
    #     - brain
    #     - my-notes

coding-police:
  # Maximum lines per file before warning to split.
  max-file-lines: 1000

  # Maximum lines per function/method before warning to decompose.
  max-function-lines: 100

  # Minimum identical consecutive lines to flag as duplicate code.
  min-duplicate-lines: 6

  # Maximum exports per file before warning about single responsibility.
  max-exports-per-file: 15

  # Maximum source files in one directory before warning to split into
  # domain subfolders. Only fires when a Write creates a new source file;
  # editing an existing file never triggers it. Set to 0 to disable.
  max-dir-files: 15

  # File path patterns to exclude from checks. Use this for homogeneous
  # one-file-per-item collections (routes/, migrations/) that legitimately
  # outgrow max-dir-files without being a mixed-concerns monolith.
  exclude-patterns: []
  # Example:
  #   exclude-patterns:
  #     - generated/
  #     - __snapshots__/
  #     - routes/
  #     - migrations/

pkg-police:
  # Which JavaScript/TypeScript package manager to enforce.
  #   auto  — infer it from the repository's lockfile (the default). bun.lock
  #           or bun.lockb → bun, package-lock.json → npm, pnpm-lock.yaml →
  #           pnpm, yarn.lock → yarn. No lockfile, or several that disagree,
  #           means there is no basis to judge and nothing is blocked.
  #   bun | npm | pnpm | yarn — enforce that one whatever the lockfile says.
  #   off   — disable the unit entirely.
  # An unrecognised name disables the unit; quoting the value is fine.
  # Every pnpm/yarn command belonging to another manager is blocked, as is every
  # npm/bun subcommand that writes package.json, node_modules or the lockfile —
  # read-only queries such as `npm ls` are left alone. The refusal names the
  # equivalent command in the enforced manager. AGENTKIT_ALLOW_PKG=1 overrides a
  # single command regardless of this setting.
  manager: auto

resource-police:
  # Whether resource-intensive commands (builds, tests, typechecks, dependency
  # installs) must run through bounded-run. Off by default: nothing is bounded
  # anywhere, and the Codex resource policy is not installed. Claude Code and
  # OpenCode honor a change immediately; Codex policies update on the next
  # install.sh run. The value must be the literal `true` to enable.
  # Bounding matches command prefixes, so privileged or remote wrappers
  # (sudo, ssh) around a heavy command are only caught when delegation-police
  # below is also enabled.
  enabled: false

  # When enabled, the command classes that require bounded-run. Remove entries
  # to relax individual classes; omitting the whole list bounds every class.
  #   js-packages — bun/npm/pnpm/yarn dependency changes (add/install/update)
  #   js-scripts  — package-script builds, checks, lints, and test suites
  #   typescript  — tsc (direct, bunx, npx)
  #   playwright  — playwright test
  #   cargo       — cargo build/check/test/clippy
  #   go          — go build/test
  #   moon        — moon ci/check/run
  #   python      — pytest, pip/uv installs
  bounded:
    - js-packages
    - js-scripts
    - typescript
    - playwright
    - cargo
    - go
    - moon
    - python

delegation-police:
  # Whether delegated and privileged workloads (ssh, sudo, ansible, container
  # engines, service managers, kubectl mutations) are blocked outside
  # engine-native limits. Off by default: nothing is blocked. Claude Code and
  # OpenCode honor a change immediately; the Codex policy installs or
  # uninstalls on the next install.sh run. Read-only diagnostics are always
  # allowed even when enabled.
  enabled: false

version-police:
  # Set to false to disable stale-major dependency-pin blocking.
  # Can also be disabled via AGENTKIT_SKIP_HOOKS=version-police.
  enabled: true

  # Packages exempted from the major-behind check (deliberate pins).
  # Applies to every manifest, including package.json (which has no comments).
  # Exact names or "*" globs are supported.
  exceptions: []
  # Example:
  #   exceptions:
  #     - serde
  #     - "@types/*"

comment-police:
  # Maximum lines in a single body comment block before warning.
  max-block-lines: 6

  # Maximum lines in a top-of-file comment header before warning.
  # ("Tutorial-style" headers belong in the README, not in the file.)
  max-header-lines: 10

  # Maximum comment-to-(comment+code) line ratio per file before warning.
  max-comment-ratio: 0.3

  # Regex patterns flagged as rotting references (PR / plan / commit
  # references belong in the PR description / commit message, not in code).
  forbidden-patterns:
    - 'Plan-?\d+'
    - 'PR\s*#?\d+'
    - 'closes\s*#\d+'
    - 'fixes\s*#\d+'
    - 'TODO[: ]+(for|after|once)\b'
    - "as part of (this|the) (PR|MR|fix)"

  # File path patterns to exclude from checks.
  exclude-patterns: []
  # Example:
  #   exclude-patterns:
  #     - vendor/
  #     - generated/

# Read by the `wip` status surface, the `plan-gate` checker, and the
# plan-police hook. A repository's own .agentkit/config.yaml overrides this.
wip:
  # Where plans live. Replaces the defaults outright:
  # plans/, docs/plans/, doc/plans/, .omc/plans/, PLAN.md, PLANS.md
  plan-paths: []
  # Example:
  #   plan-paths:
  #     - design/decisions
  #     - ROADMAP.md

  # Headings whose list items are gaps. Matched case-insensitively against the
  # whole heading text.
  # gap-headings: 'known gaps|loose ends|snags'

  # What it looks like for a plan to claim it is finished. plan-police refuses
  # an edit that adds one of these while a gap is neither ticked nor tracked.
  # done-markers: '^[[:space:]]*status[[:space:]]*:[[:space:]]*(done|shipped)'

  # What counts as a gap being tracked by an issue. A Jira-style PROJ-123 is
  # deliberately absent by default: nothing distinguishes it from a hex digest
  # or a UTF-8 label, and a wrong "tracked" loses the gap silently.
  # issue-refs: '#[0-9]+|![0-9]+|[A-Z][A-Z0-9]+-[0-9]+'

# Read by the `taste` skill and by the `taste-police` hook, which load one
# markdown file per convention from .agentkit/tastes/ and ~/.agentkit/tastes/.
# A repository's own .agentkit/config.yaml overrides this.
taste:
  # Load applicable tastes before acting and honor them. False makes both the
  # skill and the hook inert: nothing is read, refused, or written.
  enabled: true

  # Write or update a taste when a correction lands. False keeps the folder
  # read-only — a correction is reported rather than filed.
  learning: true
