# agentkit's own product manifest — dogfooding the product-review skill.
# See plugins-cc/agentkit/skills/product-review/SKILL.md for the contract.

summary: >-
  Cross-platform enforcement hooks (git, MR, package, resource, review,
  formatting and comment discipline), agent skills, two MCP servers, and a
  portable evidence validator, configurable review-profile resolver, and a
  Linux-only memory-and-CPU-bounded command runner. The full installer supports
  global and project-local use; the Claude Code plugin is a separate bundle.

surfaces:
  - name: test-suite
    kind: library
    # This repo-owned adapter keeps the command verbatim on every host: Linux
    # delegates to installed agentkit-run; other platforms execute directly.
    build: scripts/product-command default -- bun install
    verify: scripts/product-command default -- bun test
    expect: |
      The suite passes with 0 failures. Platform-specific skips are expected and
      must be reported by surface rather than summarized as a small fixed count.
      Deliberately not a pinned count — this file exists to catch stale
      expectations, so it should not carry one that drifts on every PR that adds a test.
      The suite is the real gate on this repo: it asserts the plugin wiring,
      that every police hook parses under `bash -n`, and that `skills/` stays
      byte-identical to the plugin mirror.

  - name: plugin
    kind: desktop
    # There is no build step — the plugin IS the repo contents, installed by
    # reference from the marketplace.
    run: |
      claude plugin marketplace add developerinlondon/agentkit
      claude plugin install agentkit
    expect: |
      `claude plugin list --json` shows the plugin enabled with no loader
      errors, and Claude auto-discovers the police hooks from
      `hooks/hooks.json`. Attempting a forge merge without a passing review
      record in `.agentkit/reviews/` is refused with a BLOCKED message rather
      than silently allowed. When the exact target commit has
      `.agentkit/review-policy.json`, the hook ignores source-policy weakening,
      derives changed paths from the exact commits, and requires strict v2
      evidence through the bundled `review-gate` validator. A timeout, crash,
      or malformed response from that policy hook is converted to an explicit
      deny before the host hook deadline.

  - name: opencode-plugin
    kind: cli
    run: |
      set -eu
      project="$(mktemp -d)"
      trap 'rm -rf "$project"' EXIT
      probe_home="$project/home"
      mkdir -p "$probe_home"
      CI=1 AGENTKIT_SKIP_PROMPT=1 ./install.sh "$project"
      if ! output="$(
        cd "$project"
        HOME="$probe_home" \
          XDG_CONFIG_HOME="$project/xdg-config" \
          XDG_DATA_HOME="$project/xdg-data" \
          XDG_CACHE_HOME="$project/xdg-cache" \
          opencode debug config --print-logs --log-level DEBUG 2>&1
      )"; then
        printf '%s\n' "$output"
        exit 1
      fi
      printf '%s\n' "$output"
      for error in 'failed to load plugin' 'plugin config hook failed' 'plugin dispose hook failed'; do
        if printf '%s\n' "$output" | grep -Fq "$error"; then
          exit 1
        fi
      done
      for plugin in plugins/*.ts; do
        name="${plugin##*/}"
        if ! printf '%s\n' "$output" | grep -Fq "/.opencode/plugins/$name"; then
          exit 1
        fi
      done
    expect: |
      A project-local install completes without touching the reviewer's normal
      OpenCode configuration. OpenCode starts with every shipped OpenCode plugin
      in its resolved configuration and emits no load, config-hook, or dispose-hook
      error. The probe fails even though `opencode debug config` itself can exit 0
      after logging one of those errors.

  - name: review-gate
    kind: cli
    run: tools/review-gate --help
    expect: |
      Exits successfully and prints the strict validator usage, including
      policy, changed-path, immutable repository ID, source SHA, and target SHA
      arguments. The validator performs structural and semantic consistency
      checks; it does not claim reviewer identity or evidence truth.

  - name: review-profile
    kind: cli
    run: tools/review-profile --help
    expect: |
      Exits successfully and documents the fast, balanced, and strict profiles,
      task risk, release/user-facing context, and repository selection. A normal
      invocation emits JSON with the selected lanes and check scope. Local
      configuration cannot weaken target-owned review policy.

  - name: codex-review-hook
    kind: cli
    run: codex --version
    expect: |
      A global or project install creates a Codex `PreToolUse` hook manifest
      with Bash and MCP merge routes, preserves unrelated hooks, and packages
      `review-police`, its fail-closed supervisor, input helper, `review-gate`,
      and `review-profile` under the same `.codex` root. After the user trusts the
      changed definition with `/hooks`, a direct REST/GraphQL/MCP merge is
      denied and a forge CLI merge must satisfy the same exact-context evidence
      policy as Claude Code.

  - name: platform-command
    kind: cli
    run: scripts/product-command default -- echo ok
    expect: |
      On Linux, prints `ok` having run the command inside a systemd scope with
      memory and CPU limits. A workload that exceeds the profile is killed
      rather than allowed to exhaust the host. On non-Linux, where that runner
      is unsupported, the same verbatim command prints `ok` directly.

  - name: infra-tools-mcp
    kind: api
    run: scripts/product-command default -- bun plugins-cc/agentkit/server/index.ts
    expect: |
      Speaks JSON-RPC on stdin/stdout; `tools/list` returns ten read-only git,
      helm and tofu tools and nothing that mutates infrastructure.

requires:
  hardware: []
  credentials: []
  notes:
    - Claude Code (or OpenCode) must be installed to exercise the `plugin`
      surface. The exact test-suite commands need bun. On Linux,
      `scripts/product-command` also requires the installed `agentkit-run`
      entry point and fails closed if it is absent.
    - >-
      Local containment is Linux-only and requires cgroup v2, a systemd user
      manager, and a provisioned agent-work.slice. On non-Linux hosts the
      installer omits bounded-run and its Codex resource policy. OpenCode
      delegation protection remains active. Claude hook protection requires
      jq, awk, cat, and python3. The review gate fails closed when its jq/python3
      evaluation cannot run; some older non-review hooks still fail open when
      an optional dependency is unavailable.
    - >-
      This repo's own hooks are usually already active on a developer machine
      and will intercept naive verification. Two you WILL hit: running the
      runner in place (`./tools/bounded-run …`) is refused because trust is by
      installed path, not by name — and `AGENTKIT_ALLOW_DELEGATED=1` does NOT
      clear that one; and editing this repo's docs can trip review-police
      because the text contains merge-shaped commands, so use file tools rather
      than shell heredocs when writing about it. A reviewer hitting either is
      seeing the product work, not a defect.

cannot_verify:
  - surface: plugin
    what: hooks actually blocking a real tool call
    why: >-
      needs a live Claude Code session driving real tool calls. The suite
      proves the scripts' behaviour and that they are registered for the right
      matchers, which is one layer short of "the harness honoured the deny".
  - surface: plugin
    what: the install path itself (marketplace add + install)
    why: >-
      mutates the reviewer's own Claude Code configuration, so it is left to a
      human rather than run automatically.
  - surface: codex-review-hook
    what: trusted hook blocking a real Codex tool call
    why: >-
      requires installing into and changing the reviewer's Codex configuration,
      explicitly trusting the hook definition, and driving a live tool call.
      Installer and payload regressions verify the layer immediately below it.
